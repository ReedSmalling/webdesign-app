<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Monroe Web Design</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #1e293b; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    p.lead { color: #64748b; margin-top: 0; }
    label { display: block; font-weight: 600; font-size: 0.875rem; margin-top: 1rem; }
    input, textarea { width: 100%; box-sizing: border-box; margin-top: 0.35rem; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    .consent { display: flex; gap: 0.75rem; align-items: flex-start; margin-top: 1.25rem; padding: 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem; }
    .consent input { width: auto; margin-top: 0.25rem; }
    .consent label { font-weight: 400; margin-top: 0; font-size: 0.875rem; }
    button { margin-top: 1.25rem; width: 100%; padding: 0.75rem 1rem; background: #2563eb; color: white; border: none; border-radius: 0.5rem; font-weight: 600; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .fine { font-size: 0.8rem; color: #64748b; margin-top: 1rem; }
    .success { display: none; margin-top: 1rem; padding: 1rem; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 0.5rem; color: #065f46; }
    footer { margin-top: 2rem; font-size: 0.875rem; }
    footer a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>Monroe Web Design</h1>
  <p class="lead">Request a quote for a professional website.</p>

  <form id="contact-form">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required autocomplete="name" />

    <label for="business">Business name</label>
    <input id="business" name="business" type="text" required />

    <label for="phone">Mobile phone</label>
    <input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="(318) 555-1234" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email" />

    <label for="message">How can we help?</label>
    <textarea id="message" name="message" required placeholder="Tell us about your business and website needs."></textarea>

    <div class="consent">
      <input id="sms-consent" name="sms-consent" type="checkbox" required />
      <label for="sms-consent">
        <strong>SMS consent:</strong> I agree to receive SMS from Monroe Web Design about my website inquiry.
        Message frequency varies. Message and data rates may apply.
        Reply <strong>STOP</strong> to opt out or <strong>HELP</strong> for help.
        Consent is not required to purchase services.
        See our <a href="/privacy.html">Privacy Policy</a> and <a href="/sms-terms.html">SMS Terms</a>.
      </label>
    </div>

    <button type="submit">Submit request</button>
  </form>

  <div id="success" class="success" role="status">
    Thank you. Your request was received. We may follow up by email or SMS about your inquiry.
  </div>

  <p class="fine">
    By submitting this form, you confirm the information above is accurate.
  </p>

  <footer>
    <a href="/privacy.html">Privacy Policy</a> · <a href="/sms-terms.html">SMS Terms</a>
  </footer>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('contact-form').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    });
  </script>
</body>
</html>
